<!DOCTYPE html>
<html lang="en">
<head>
<title> Registration Form</title>
<style>
  body {
  display: flex;
  justify-content: center;  
  align-items: center;  
  height: 150vh; 
  margin: 0; 
  flex-direction: column; 
  background-color: #f0f0f0; 
  margin-bottom: 50px;
  margin-top: 50px;
  }
  .flex-container {
    display: flex;
    flex-direction: row;
    background-color: DodgerBlue;
    width: 540px;
    height: 780px;
    border: 5px solid DodgerBlue;
  }

  .left-column {
    display: flex;
    justify-content: center;
    flex-direction: column;
    align-items: flex-start;
    background-color: #f1f1f1;
    width: 245px;
    height: 710px;
    padding: 25px; 
    text-align: center;
    font-size: 30px;
    margin-right: 5px; 
    overflow: auto;
  }

  .left-column input[type="checkbox"] {
    display: inline-block;
    width: auto; 
    margin-right: 5px;
  }

  .left-column label {
    font-size: 12px;
    text-align: left;
    display: block;
  }

  .left-column input, .left-column select, .left-column textarea {
    width: 115%;
    margin: 5px 0;
    padding: 5px;
    box-sizing: border-box;
  }

  .right-column {
    display: flex;
    flex-direction: column;
  }

  .right-column > div {
    background-color: #f1f1f1;
    width: 50px;
    padding: 25px;
    text-align: center;
    font-size: 30px;
    margin-bottom: 5px; 
  }

  .right-column > div:first-child { 
    background-color: #f1f1f1;
    width: 180px;
    flex-grow: 2; 
    padding: 35px; 
    text-align: center;
    font-size: 30px;
  }

  .right-column > div:last-child {
    background-color: #f1f1f1;
    width: 180px;
    flex-grow: 1; 
    padding: 35px; 
    text-align: center;
    font-size: 30px;
    margin-bottom: 0;
  }

  .submit-btn {
    width: 115%;
    padding: 8px;
    background-color: DodgerBlue;
    color: white;
    border: none;
    cursor: pointer;
  }

  h5 {
    margin-top: 0px; 
    margin-bottom: 20px;
  }

  .error {
    border: 1px solid red;
  }
  
  .error-message {
    color: red;
    font-size: 10px;
    margin-top: 2px;
    text-align: left;    /* <<< force left align */
    width: 100%;         /* <<< make it full width */
    padding-left: 2px;
    /*display: none;*/
  }

</style>
</head>
<body>
  <img src = "DSC_0149-01.jpeg" alt = "Logo" style="width:50px;height:50px;border-radius:50%;margin-bottom:0px;">
  <h4>Tonoy</h4>
  <div class="flex-container">
    <div class="left-column">
      <form>
        <h5>Registration Form</h5>
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" name="fullName">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">

        <label for="confirmPassword">Confirm Password:</label>
        <input type="password" id="confirmPassword" name="confirmPassword">

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">

        <label for="country">Country:</label>
        <select id="country" name="country">
          <option value="" disabled selected>Select your country</option>
          <option value="usa">USA</option>
          <option value="uk">UK</option>
          <option value="canada">Canada</option>
          <option value="bangladesh">Bangladesh</option>
          <option value="austrailia">Austrailia</option>
          <option value="other">Other</option>
        </select>

        <label>Gender:</label>
        <div style="display: flex; gap: 10px; align-items: center;">
          <input type="radio" id="male" name="gender" value="male">
          <label for="male">Male</label>
        
          <input type="radio" id="female" name="gender" value="female">
          <label for="female">Female</label>
        
          <input type="radio" id="other" name="gender" value="other">
          <label for="other">Other</label>
        </div>

        <label for="color">Favorite Color:</label>
        <input type="color" id="color" name="color">

        <label for="opinion">Your Opinion:</label>
        <textarea id="opinion" name="opinion" rows="2" placeholder="Share your thoughts..."></textarea>

        <div style="display: flex; gap: 10px; align-items: center;">
          <input type="checkbox" id="terms" name="terms" required>
          <label for="terms">I agree to the <a href="#">Terms and Conditions</a></label>
        </div>

        <button type="submit" class="submit-btn">Register</button>
      </form>
    </div>
    <div class="right-column">
      <div></div>
      <div></div>
    </div>
  </div>
  <script>
    document.querySelector("form").addEventListener("submit", function (e) {
      e.preventDefault(); // prevent submit initially
      let isValid = true; // flag to check all fields
      
      // Clear previous error styles/messages
      document.querySelectorAll(".error-message").forEach(el => el.remove());
      document.querySelectorAll("input, select, textarea").forEach(el => el.classList.remove("error"));
    
      const fullNameInput = document.getElementById("fullName");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const dobInput = document.getElementById("dob");
      const countryInput = document.getElementById("country");
      const genderInputs = document.querySelectorAll('input[name="gender"]');
      //const termsCheckbox = document.getElementById("terms");
    
      const fullName = fullNameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;
      const dob = new Date(dobInput.value);
    
      const nameRegex = /^[A-Za-z\s]+$/;
      const emailRegex = /^[a-zA-Z0-9._%+-]+@student\.aiub\.edu$/;
      const uppercaseRegex = /[A-Z]/;
      const numberRegex = /[0-9]/;
      const symbolRegex = /[^A-Za-z0-9]/;
    
      // Helper function to show error
      function showError(input, message) {
        input.classList.add("error");
        const error = document.createElement("div");
        error.className = "error-message";
        error.innerText = message;
        error.style.display = "block";
        input.parentNode.insertBefore(error, input.nextSibling);
        isValid = false;
      }
    
      // Full Name
      if (!fullName) {
        showError(fullNameInput, "*Full Name is required");
      } else if (!nameRegex.test(fullName)) {
        showError(fullNameInput, "*Full Name should only contain letters and spaces");
      }
    
      // Email
      if (!email) {
        showError(emailInput, "*Email is required");
      } else if (!emailRegex.test(email)) {
        showError(emailInput, "*Email must be a valid student email (example@student.aiub.edu)");
      }
    
      // Password
      if (!password) {
        showError(passwordInput, "*Password is required");
      } else if (password.length !== 8) {
        showError(passwordInput, "*Password must be exactly 8 characters");
      } else if (!uppercaseRegex.test(password) || !numberRegex.test(password) || !symbolRegex.test(password)) {
        showError(passwordInput, "*Password must contain uppercase, number, and special character");
      }
    
      // Confirm Password
      if (!confirmPassword) {
        showError(confirmPasswordInput, "*Please confirm your password");
      } else if (password !== confirmPassword) {
        showError(confirmPasswordInput, "*Passwords do not match");
      }
    
      // Date of Birth
      if (!dobInput.value) {
        showError(dobInput, "*Date of Birth is required");
      } else {
        const currentDate = new Date();
        let age = currentDate.getFullYear() - dob.getFullYear();
        const monthDiff = currentDate.getMonth() - dob.getMonth();
        const dateDiff = currentDate.getDate() - dob.getDate();
    
        if (monthDiff < 0 || (monthDiff === 0 && dateDiff < 0)) {
          age--;
        }
        if (age < 18) {
          showError(dobInput, "*You must be at least 18 years old");
        }
      }
    
      // Country
      if (!countryInput.value) {
        showError(countryInput, "*Please select your country");
      }
    
      // Gender
      let genderSelected = false;
      genderInputs.forEach(input => {
        if (input.checked) genderSelected = true;
      });
      if (!genderSelected) {
        const genderContainer = genderInputs[0].parentNode;
        const error = document.createElement("div");
        error.className = "error-message";
        error.innerText = "*Please select your gender";
        error.style.display = "block"; 
        genderContainer.parentNode.insertBefore(error, genderContainer.nextSibling);
        isValid = false;
      }
    
      // Terms and Conditions
      /*if (!termsCheckbox.checked) {
        showError(termsCheckbox, "*You must agree to the Terms and Conditions");
      }*/
    
      // Finally, if all fields valid, submit form
      if (isValid) {
        this.submit();
      }
    });
    </script>    
</body>
</html>
