<!DOCTYPE html>
<html lang="en">
<head>
<style>
  body {
  display: flex;
  justify-content: center;  /* Center horizontally */
  align-items: center;  /* Center vertically */
  height: 100vh;  /* Full viewport height */
  margin: 0;  /* Remove default margin */
  flex-direction: column; /* Stack elements vertically */
  background-color: #f0f0f0; /* Optional background */
  }
  .flex-container {
    display: flex;
    flex-direction: row;
    background-color: DodgerBlue;
    width: 200px;
    height: 175px;
    border: 5px solid DodgerBlue;
  }

  .left-column {
    display: flex;
    align-items: center; /* Center the single box */
    justify-content: center;
    background-color: #f1f1f1;
    width: 50px;
    height: 125px;
    padding: 25px; /* Adjust height */
    text-align: center;
    font-size: 30px;
    margin-right: 5px; /* Space between left and right */
  }

  /* Right column (box 2 and 3) */
  .right-column {
    display: flex;
    flex-direction: column;
  }

  .right-column > div {
    background-color: #f1f1f1;
    width: 50px;
    padding: 25px;
    text-align: center;
    font-size: 30px;
    margin-bottom: 5px; /* Space between box 2 and 3 */
  }

  .right-column > div:first-child { /* Box 2 */
    background-color: #f1f1f1;
    width: 50px;
    flex-grow: 2; /* Make box 2 grow larger */
    padding: 35px; /* Increase padding for more height */
    text-align: center;
    font-size: 30px;
  }

  .right-column > div:last-child {
    background-color: #f1f1f1;
    width: 90px;
    flex-grow: 1; /* Make box 3 smaller */
    padding: 15px; /* Decrease padding for less height */
    text-align: center;
    font-size: 30px;
    margin-bottom: 0; /* Remove extra margin for last box */
  }
</style>
</head>
<body>
  <img src = "DSC_0149-01.jpeg" alt = "Logo" style="width:50px;height:50px;border-radius:50%;margin-bottom:0px;">
  <h4>Tonoy</h4>
  <div class="flex-container">
    <div class="left-column"></div>
    <div class="right-column">
      <div></div>
      <div></div>
    </div>
  </div>
    
</body>
</html>
